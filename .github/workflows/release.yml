name: Release

# On a v* tag: build the wasm from source, run the tests, STAGE it to npm via
# OIDC trusted publishing (no NPM_TOKEN secret required — the package's
# Trusted Publisher is configured on npmjs.com with direct `npm publish`
# deliberately left disallowed, per npm's own recommendation), and cut a
# GitHub Release with the built artifacts attached.
#
# Staging never prompts for 2FA (safe for CI), but the package is NOT public
# yet. A human must run `npm stage approve <id>` locally afterward — 2FA is
# required for that step, which is the whole point (proof of presence: a
# compromised CI job can stage a malicious version, but it can never
# publish one on its own). This job prints the exact command to run.
#
# Cut a release with:  npm version <patch|minor|major> && git push --follow-tags

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build & publish (e.g. v1.5.0)'
        required: true

permissions:
  contents: write # create the GitHub Release
  id-token: write # OIDC for npm provenance / trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org' # required for OIDC trusted publishing

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.10
          actions-cache-folder: emsdk-cache

      - run: npm ci

      - name: Build wasm from source
        run: bash compileLibraw.sh

      - name: Unit test
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Integration test
        run: npm run test:integration

      - name: Upgrade npm (trusted publishing needs npm >= 11.5)
        run: npm install -g npm@latest

      - name: Stage to npm (provenance via OIDC trusted publishing; needs human approval)
        run: |
          echo "npm $(npm --version) / node $(node --version)"
          VERSION=$(node -p "require('./package.json').version")
          # Idempotent: a tag push and a manual re-run can both fire for the same
          # version; skip (don't fail) if it's already live on npm so the release
          # still completes and the GitHub Release step below still runs. This
          # only catches an already-APPROVED version — a stale, never-approved
          # stage from a previous run is harmless and npm will just report it.
          if npm view "libraw-wasm-nothread@${VERSION}" version >/dev/null 2>&1; then
            echo "libraw-wasm-nothread@${VERSION} is already published — skipping npm stage."
          else
            npm stage publish --provenance --access public
            echo "::notice::Staged, not published. A maintainer must now run: npm stage approve <id> (see 'npm stage list' for <id>) — this requires 2FA and cannot be done from CI."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            libraw.wasm
            dist/**
